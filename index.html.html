 g('muVF').style.width=(MU.vol*100)+'%';g('muVK').style.left=(MU.vol*100)+'%';
 g('muPP').innerHTML=MU.pl?IC.pause:IC.play}
function muTick(){if(!MU.pl)return;MU.pos+=1;if(MU.pos>=MU.dur)MU.pos=0;muUpdate()}
const ratioOf=(el,e)=>{const r=el.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
A.muPlay=()=>{MU.pl=!MU.pl;muUpdate()};
A.muPrev=()=>{MU.pos=0;muUpdate()};
A.muNext=()=>{MU.pos=0;muUpdate()};
A.muSeek=(d,el,e)=>{MU.pos=Math.floor(ratioOf(el,e)*MU.dur);muUpdate()};
A.muVol=(d,el,e)=>{MU.vol=ratioOf(el,e);muUpdate()};

 $('#sbT').textContent=clock12(now);

 rot('hH',(p.h%12)*30+p.mi*.5);rot('hM',p.mi*6+p.s*.1);rot('hS',p.s*6);
 muTick();if(p.s===0)tickClock()}

 fe.style.width=(356*SC)+'px';fe.style.height=(640*SC)+'px';dv.style.transform='scale('+SC+')'}
